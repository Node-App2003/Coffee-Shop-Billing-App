name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project (first time only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Make sure the biometric permission is in the manifest
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q USE_BIOMETRIC "$f" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' "$f"
          grep -n "uses-permission" "$f"

      - name: Use the fixed signing key (so every new APK installs over the old one)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cafe-billing-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
